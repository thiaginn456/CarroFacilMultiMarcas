<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecionando...</title>
    <script>
        (() => {
            const path = window.location.pathname;
            const repoMatch = path.match(/^\/[^/]+/);
            const repo = repoMatch ? repoMatch[0] : '';
            const relativePath = path.startsWith(repo) ? path.slice(repo.length) || '/' : path;
            const target = `${repo}/?p=${encodeURIComponent(relativePath)}`;
            window.location.replace(target);
        })();
    </script>
</head>

<body>
    <p>Redirecionando...</p>
</body>

</html>
